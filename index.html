<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>实战英语 · Real-Talk English</title>
  <meta name="description" content="场景实战式英语学习：真实职场与旅行对话，点句子/单词即可朗读。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/" data-link>
        <span class="brand-logo">🗣️</span>
        <span class="brand-text">
          <strong data-i18n="brandTitle">实战英语</strong>
          <small data-i18n="brandSub">Real-Talk English</small>
        </span>
      </a>
      <div class="header-actions">
        <a id="wordStudyBtn" class="btn-ghost" href="#/words" title="精学单词 / Deep Word Study">
          <span>🎯</span> <span data-i18n="wordStudy">精学单词</span>
        </a>
        <a id="patternsBtn" class="btn-ghost" href="#/patterns" title="句型公式 / Sentence Formulas">
          <span>🧩</span> <span data-i18n="patterns">句型公式</span>
        </a>
        <a id="reviewBtn" class="btn-ghost" href="#/review" title="复习中心 / Review center">
          <span>📚</span> <span data-i18n="reviewCenter">复习中心</span>
          <span id="reviewCount" class="wb-count">0</span>
        </a>
        <button id="langToggle" class="btn-ghost" title="切换语言 / Switch language">
          <span data-i18n="langToggle">EN</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="wrap">
    <!-- Views are rendered here by js/app.js -->
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span data-i18n="footer">用真实场景练英语 · 点句子或单词即可朗读</span>
    </div>
  </footer>

  <!-- App core -->
  <script src="js/i18n.js"></script>
  <script src="js/speech.js"></script>

  <!-- Word lookup: glossaries + dictionary + word book -->
  <script src="data/glossary.js"></script>
  <script src="data/common-words.js"></script>
  <script src="js/dict.js"></script>
  <script src="js/wordbook.js"></script>
  <script src="js/notes.js"></script>

  <!-- 句型公式数据 -->
  <script src="data/patterns.js"></script>

  <!-- 内容清单：登记场景的唯一入口（加内容只改这里 + data/scenes/ 下新增文件，详见 SKILL.md） -->
  <script src="data/scenes-index.js"></script>

  <!-- App：会根据清单自动加载 data/scenes/<id>.js，无需在此手动添加场景脚本 -->
  <script src="js/app.js"></script>
</body>
</html>
